<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>@zuy_silva emagrecer - Quiz de Hábitos & Conforto Abdominal</title>
  <meta name="description" content="Descubra o motivo biológico do inchaço e receba seu protocolo de 7 dias com o @zuy_silva emagrecer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================================
       1. CSS RESET & MOBILE-FIRST BASE STYLES
       ======================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #FAF9F5;
      --color-card-bg: #FFFFFF;
      --color-text-main: #1C1917;
      --color-text-muted: #57534E;
      --color-primary: #C2542A;
      --color-primary-hover: #A9451F;
      --color-primary-active: #8F3716;
      --color-emerald-deep: #1E5438;
      --color-emerald-light: #ECFDF5;
      --color-emerald-border: #A7F3D0;
      --color-amber-bg: #FFFBEB;
      --color-border: #E7E5E4;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-xl: 1.5rem;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-elevated: 0 20px 30px -10px rgba(0, 0, 0, 0.08), 0 10px 15px -5px rgba(0, 0, 0, 0.04);
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    img, svg, video {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ========================================================
       2. TYPOGRAPHY (FLUID SIZING VIA CLAMP)
       ======================================================== */
    h1, .h1-display {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 4.5vw, 2rem);
      line-height: 1.25;
      font-weight: 800;
      color: var(--color-text-main);
    }

    h2, .h2-display {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3.8vw, 1.65rem);
      line-height: 1.3;
      font-weight: 700;
    }

    h3 {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
    }

    p {
      font-size: clamp(0.875rem, 2.5vw, 1rem);
      color: var(--color-text-muted);
    }

    /* ========================================================
       3. RESPONSIVE CONTAINER & CARD ARCHITECTURE
       ======================================================== */
    .app-header {
      width: 100%;
      background: rgba(250, 249, 245, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      width: 92%;
      max-width: 600px;
      margin: 0 auto;
      height: 3.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 800;
      color: var(--color-emerald-deep);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .main-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 0 2.5rem;
    }

    /* Core Quiz Card: max-width 600px desktop, 92-95% on mobile */
    .quiz-card {
      width: 94%;
      max-width: 600px;
      margin: 0 auto;
      background: var(--color-card-bg);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-elevated);
      padding: 1.25rem 1rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    @media (min-width: 480px) {
      .quiz-card {
        padding: 1.75rem 1.5rem;
      }
    }

    @media (min-width: 640px) {
      .quiz-card {
        width: 92%;
        padding: 2.25rem 2rem;
      }
    }

    /* ========================================================
       4. PROGRESS BAR (VISUAL ADVANCEMENT TRACK & BADGE)
       ======================================================== */
    .progress-section {
      width: 100%;
      margin: -1.25rem -1rem 1.25rem -1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--color-border);
      background: #FDFCF9;
    }

    @media (min-width: 480px) {
      .progress-section {
        margin: -1.75rem -1.5rem 1.5rem -1.5rem;
      }
    }

    @media (min-width: 640px) {
      .progress-section {
        margin: -2.25rem -2rem 1.75rem -2rem;
      }
    }

    .progress-bar-track {
      width: 100%;
      height: 0.5rem;
      background: #E5E7EB;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #C2542A 0%, #E07144 50%, #1E5438 100%);
      width: 12%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem 0.25rem;
      font-size: 0.75rem;
    }

    .step-counter {
      font-weight: 700;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .step-counter-pulse {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--color-primary);
      display: inline-block;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .badge-percent {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.75rem;
      background: var(--color-emerald-light);
      color: var(--color-emerald-deep);
      border: 1px solid var(--color-emerald-border);
    }

    .segmented-dots {
      display: flex;
      gap: 0.35rem;
      padding: 0.35rem 1rem 0;
    }

    .dot-segment {
      flex: 1;
      height: 0.25rem;
      border-radius: 9999px;
      background: #E5E7EB;
      transition: var(--transition-smooth);
    }

    .dot-segment.active {
      background: var(--color-primary);
    }

    .dot-segment.completed {
      background: var(--color-emerald-deep);
    }

    /* ========================================================
       5. ACCESSIBLE TOUCH TARGETS & INTERACTIVE OPTIONS
       ======================================================== */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .options-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .option-button {
      width: 100%;
      min-height: 3.25rem; /* Min 52px para área do polegar */
      padding: 0.875rem 1rem;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--color-border);
      background: #FFFFFF;
      color: var(--color-text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: var(--transition-smooth);
      position: relative;
      touch-action: manipulation;
      user-select: none;
    }

    .option-button:hover, .option-button:active {
      border-color: #86EFAC;
      background: #F0FDF4;
      transform: translateY(-1px);
    }

    .option-button.selected {
      border-color: var(--color-emerald-deep);
      background: #ECFDF5;
      box-shadow: 0 0 0 2px rgba(30, 84, 56, 0.2);
      font-weight: 700;
    }

    .option-key-badge {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: var(--radius-sm);
      background: #F5F5F4;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: var(--transition-smooth);
    }

    .option-button.selected .option-key-badge {
      background: var(--color-emerald-deep);
      color: #FFFFFF;
    }

    /* Grid Visual (2 Colunas) */
    .option-button-visual {
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 1.25rem 0.75rem;
      gap: 0.5rem;
    }

    .visual-emoji {
      font-size: 2rem;
      line-height: 1;
    }

    /* Botão Principal de Conversão */
    .btn-cta {
      width: 100%;
      min-height: 3.25rem; /* 52px */
      padding: 1rem 1.5rem;
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 20px -4px rgba(194, 84, 42, 0.4);
      transition: var(--transition-smooth);
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn-cta:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(194, 84, 42, 0.5);
    }

    .btn-cta:active {
      background: var(--color-primary-active);
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text-muted);
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition-smooth);
      touch-action: manipulation;
    }

    .btn-secondary:hover {
      color: var(--color-text-main);
      background: #F5F5F4;
    }

    .actions-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-border);
    }

    /* ========================================================
       6. SLIDERS & METRIC CARDS
       ======================================================== */
    .slider-display {
      text-align: center;
      margin: 1.5rem 0;
    }

    .slider-number {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 900;
      color: var(--color-emerald-deep);
      line-height: 1;
    }

    .slider-unit {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-left: 0.25rem;
    }

    .range-input {
      width: 100%;
      height: 0.6rem;
      -webkit-appearance: none;
      appearance: none;
      background: #E5E7EB;
      border-radius: 9999px;
      outline: none;
      margin: 1.5rem 0;
      cursor: pointer;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(194, 84, 42, 0.4);
      border: 3px solid #FFFFFF;
      transition: transform 0.2s;
    }

    .range-input::-webkit-slider-thumb:hover, .range-input::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    /* ========================================================
       7. AUDIO PLAYER SIMULATOR
       ======================================================== */
    .audio-player-box {
      background: #F3EFE6;
      border: 1px solid #E2DCD1;
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .audio-btn {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: var(--color-emerald-deep);
      color: #FFFFFF;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(30, 84, 56, 0.3);
      transition: var(--transition-smooth);
    }

    .audio-btn:hover {
      transform: scale(1.05);
      background: #17422C;
    }

    .waveform-visual {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 2.25rem;
    }

    .wave-bar {
      flex: 1;
      background: #A8A29E;
      border-radius: 2px;
      height: 20%;
      transition: height 0.2s ease;
    }

    /* ========================================================
       8. ROULETTE WHEEL
       ======================================================== */
    .wheel-container {
      position: relative;
      width: min(280px, 75vw);
      height: min(280px, 75vw);
      margin: 1.5rem auto;
    }

    .wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #FFFFFF;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 3.5s cubic-bezier(0.15, 0.9, 0.25, 1);
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #1C1917;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* ========================================================
       9. RESULT & TESTIMONIALS CAROUSEL
       ======================================================== */
    .timer-alert {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-lg);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #991B1B;
      font-weight: 700;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .timer-clock {
      font-family: monospace;
      font-size: 1.1rem;
      background: #991B1B;
      color: #FFFFFF;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-sm);
    }

    .testimonial-card {
      background: #F9F8F6;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .faq-item {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: 0.5rem;
      overflow: hidden;
      background: #FFFFFF;
    }

    .faq-question {
      width: 100%;
      padding: 1rem;
      text-align: left;
      font-weight: 700;
      font-size: 0.95rem;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .faq-answer {
      padding: 0 1rem 1rem;
      font-size: 0.875rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      display: none;
    }

    .faq-item.open .faq-answer {
      display: block;
    }

    .text-center { text-align: center; }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="#" class="brand-logo" onclick="location.reload()">@zuy_silva emagrecer</a>
      <span style="font-size: 0.75rem; font-weight: 700; color: var(--color-emerald-deep); background: var(--color-emerald-light); padding: 0.25rem 0.6rem; border-radius: 9999px;">
        Avaliação Ativa
      </span>
    </div>
  </header>

  <!-- Main Dynamic Stage -->
  <main class="main-wrapper">
    <div class="quiz-card" id="quiz-container">
      <!-- Steps will be injected dynamically by JavaScript below -->
    </div>
  </main>

  <script>
    /* ========================================================
       DATA & FLOW CONFIGURATION
       ======================================================== */
    const HOTMART_CHECKOUT_URL = "https://pay.hotmart.com/T93171913Y?checkoutMode=10";

    const state = {
      step: 'hero',
      currentQuestionIndex: 0,
      leadName: '',
      height: 165,
      weight: 75,
      targetWeight: 65,
      answers: {},
      wonBonus: '10 Bebidas Funcionais (R$ 7,90 Grátis)'
    };

    const questions = [
      {
        id: 'q1',
        title: 'Qual região do seu corpo mais acumula inchaço ou desconforto?',
        subtitle: 'Selecione a área onde você mais sente peso ou roupas apertando:',
        type: 'grid_visual',
        options: [
          { id: 'belly', label: 'Barriga e Abdômen', emoji: '🤰' },
          { id: 'waist', label: 'Cintura e Culotes', emoji: '⏳' },
          { id: 'thighs', label: 'Pernas e Coxas', emoji: '🦵' },
          { id: 'whole', label: 'Corpo Inteiro', emoji: '💧' }
        ]
      },
      {
        id: 'q2',
        title: 'Como podemos te chamar durante o diagnóstico?',
        subtitle: 'Personalizaremos suas recomendações biológicas e o plano de 7 dias:',
        type: 'name_input'
      },
      {
        id: 'q3',
        title: 'Em qual momento do dia sua barriga mais estufa?',
        subtitle: 'Isso revela o tipo de lentidão e fermentação no seu trato digestivo:',
        type: 'standard',
        options: [
          { id: 'after_lunch', label: 'Logo após o almoço ou refeições', letter: 'A' },
          { id: 'late_afternoon', label: 'No fim da tarde / entardecer', letter: 'B' },
          { id: 'night', label: 'À noite, parecendo grávida de 4 meses', letter: 'C' },
          { id: 'all_day', label: 'Já acordo inchada e piora ao longo do dia', letter: 'D' }
        ]
      },
      {
        id: 'q4',
        title: 'Qual é a sua altura aproximada?',
        subtitle: 'Necessário para calcular a proporção hídrica corporal:',
        type: 'slider_height'
      },
      {
        id: 'q5',
        title: 'Qual é o seu peso atual aproximado?',
        subtitle: 'Para mapear o sobrepeso metabólico versus retenção líquida:',
        type: 'slider_weight'
      },
      {
        id: 'q6',
        title: 'Qual seria o seu peso meta desejado?',
        subtitle: 'O peso em que você se sente leve, disposta e com roupas confortáveis:',
        type: 'slider_target'
      },
      {
        id: 'q7',
        title: 'Ouça o áudio real de quem eliminou o inchaço:',
        subtitle: 'Veja como a Neuza destravou o metabolismo nos primeiros dias:',
        type: 'audio_interlude'
      }
    ];

    const container = document.getElementById('quiz-container');

    /* ========================================================
       RENDER ENGINE
       ======================================================== */
    function render() {
      container.innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (state.step === 'hero') {
        renderHero();
      } else if (state.step === 'quiz') {
        renderQuestion();
      } else if (state.step === 'analyzing') {
        renderAnalyzing();
      } else if (state.step === 'bmi_alert') {
        renderBmiAlert();
      } else if (state.step === 'wheel') {
        renderWheel();
      } else if (state.step === 'lead_form') {
        renderLeadForm();
      } else if (state.step === 'result') {
        renderResult();
      }
    }

    /* 1. HERO SCREEN */
    function renderHero() {
      container.innerHTML = `
        <div class="fade-in">
          <div style="background: var(--color-primary); color: #fff; padding: 0.35rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; text-align: center; margin-bottom: 1rem;">
            Avaliação Oficial de Hábitos & Digestão
          </div>

          <h1 style="margin-bottom: 1rem;">
            Você acorda com a barriga reta e termina o dia parecendo que está grávida de 4 meses?
          </h1>

          <p style="margin-bottom: 1.25rem;">
            Se ao entardecer você precisa desabotoar o botão da calça e sofre com peso no estômago, o motivo <strong>não é gordura: é fermentação alimentar e retenção hídrica</strong>.
          </p>

          <div style="background: #F9F8F6; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
            <div>✅ <strong>60 segundos:</strong> 7 perguntas rápidas para mapear sua digestão.</div>
            <div>✅ <strong>Identifique os alimentos:</strong> Descubra o que mais fermenta em você.</div>
            <div>✅ <strong>Plano prático de 7 dias:</strong> Como desinchar e aliviar a cintura.</div>
          </div>

          <button class="btn-cta" onclick="startQuiz()">
            QUERO DESCOBRIR A CAUSA DO MEU INCHAÇO →
          </button>
        </div>
      `;
    }

    function startQuiz() {
      state.step = 'quiz';
      state.currentQuestionIndex = 0;
      render();
    }

    /* 2. PROGRESS BAR COMPONENT */
    function getProgressBarHtml(current, total) {
      const percent = Math.min(100, Math.round((current / total) * 100));
      let dotsHtml = '';
      for (let i = 1; i <= total; i++) {
        let status = i < current ? 'completed' : i === current ? 'active' : '';
        dotsHtml += `<div class="dot-segment ${status}"></div>`;
      }

      return `
        <div class="progress-section">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width: ${percent}%;"></div>
          </div>
          <div class="progress-details">
            <div class="step-counter">
              <span class="step-counter-pulse"></span>
              Pergunta <strong>${current}</strong> de ${total}
            </div>
            <div class="badge-percent">
              ✨ ${percent}% Concluído
            </div>
          </div>
          <div class="segmented-dots">
            ${dotsHtml}
          </div>
        </div>
      `;
    }

    /* 3. QUESTION CONTROLLER */
    function renderQuestion() {
      const q = questions[state.currentQuestionIndex];
      const stepNum = state.currentQuestionIndex + 1;
      const totalSteps = questions.length;

      let formattedTitle = q.title.replace('{nome}', state.leadName || 'você');
      let bodyHtml = '';

      if (q.type === 'grid_visual') {
        bodyHtml = `
          <div class="options-grid-2col">
            ${q.options.map(opt => `
              <button class="option-button option-button-visual" onclick="selectOption('${opt.id}')">
                <span class="visual-emoji">${opt.emoji}</span>
                <span style="font-weight: 700; font-size: 0.95rem;">${opt.label}</span>
              </button>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'name_input') {
        bodyHtml = `
          <div style="margin: 1.5rem 0;">
            <input 
              type="text" 
              id="name-field" 
              placeholder="Digite seu primeiro nome..." 
              value="${state.leadName}"
              style="width: 100%; min-height: 3.25rem; padding: 0.85rem 1rem; border-radius: var(--radius-md); border: 2px solid var(--color-border); font-size: 1.1rem; outline: none; font-family: inherit;"
              oninput="state.leadName = this.value.trim()"
              onkeydown="if(event.key === 'Enter') advanceFromName()"
            />
            <p style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--color-text-muted);">
              🔒 Usado apenas para personalizar seu diagnóstico e o protocolo.
            </p>
          </div>
          <button class="btn-cta" onclick="advanceFromName()">
            CONTINUAR →
          </button>
        `;
      } else if (q.type === 'standard') {
        bodyHtml = `
          <div class="options-grid">
            ${q.options.map(opt => `
              <button class="option-button" onclick="selectOption('${opt.id}')">
                <span class="option-key-badge">${opt.letter}</span>
                <span style="flex: 1;">${opt.label}</span>
              </button>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'slider_height') {
        bodyHtml = `
          <div class="slider-display">
            <span class="slider-number" id="height-val">${(state.height / 100).toFixed(2).replace('.', ',')}</span>
            <span class="slider-unit">m</span>
          </div>
          <input 
            type="range" 
            min="140" 
            max="205" 
            value="${state.height}" 
            class="range-input" 
            oninput="state.height = Number(this.value); document.getElementById('height-val').innerText = (this.value / 100).toFixed(2).replace('.', ',');"
          />
          <button class="btn-cta" onclick="nextQuestion()">
            CONFIRMAR ALTURA →
          </button>
        `;
      } else if (q.type === 'slider_weight') {
        bodyHtml = `
          <div class="slider-display">
            <span class="slider-number" id="weight-val">${state.weight}</span>
            <span class="slider-unit">kg</span>
          </div>
          <input 
            type="range" 
            min="45" 
            max="140" 
            value="${state.weight}" 
            class="range-input" 
            oninput="state.weight = Number(this.value); document.getElementById('weight-val').innerText = this.value;"
          />
          <button class="btn-cta" onclick="nextQuestion()">
            CONFIRMAR PESO ATUAL →
          </button>
        `;
      } else if (q.type === 'slider_target') {
        bodyHtml = `
          <div class="slider-display">
            <span class="slider-number" id="target-val">${state.targetWeight}</span>
            <span class="slider-unit">kg</span>
          </div>
          <p style="text-align: center; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--color-emerald-deep); font-weight: 700;">
            Meta de alívio: -${Math.max(0, state.weight - state.targetWeight)} kg
          </p>
          <input 
            type="range" 
            min="40" 
            max="120" 
            value="${state.targetWeight}" 
            class="range-input" 
            oninput="state.targetWeight = Number(this.value); document.getElementById('target-val').innerText = this.value;"
          />
          <button class="btn-cta" onclick="nextQuestion()">
            CONFIRMAR PESO META →
          </button>
        `;
      } else if (q.type === 'audio_interlude') {
        bodyHtml = `
          <div class="audio-player-box">
            <button class="audio-btn" id="play-btn" onclick="toggleAudioDemo()">
              ▶
            </button>
            <div style="flex: 1;">
              <strong style="display: block; font-size: 0.95rem; color: #1C1917;">Áudio de Neuza (52 anos)</strong>
              <span style="font-size: 0.8rem; color: #78716C;">"Desinchei 3kg de estufamento já na primeira semana..."</span>
              <div class="waveform-visual" id="waveform">
                ${Array.from({length: 24}).map((_, i) => `<div class="wave-bar" style="height: ${20 + (i % 5) * 15}%;"></div>`).join('')}
              </div>
            </div>
          </div>
          <button class="btn-cta" onclick="nextQuestion()">
            OUVIR & CONTINUAR DIAGNÓSTICO →
          </button>
        `;
      }

      container.innerHTML = `
        <div class="fade-in">
          ${getProgressBarHtml(stepNum, totalSteps)}
          <h2>${formattedTitle}</h2>
          <p style="margin-top: 0.35rem;">${q.subtitle}</p>
          ${bodyHtml}
          ${state.currentQuestionIndex > 0 ? `
            <div class="actions-footer">
              <button class="btn-secondary" onclick="prevQuestion()">
                ← Voltar
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function selectOption(optId) {
      const q = questions[state.currentQuestionIndex];
      state.answers[q.id] = optId;
      nextQuestion();
    }

    function advanceFromName() {
      const field = document.getElementById('name-field');
      if (field && field.value.trim().length >= 2) {
        state.leadName = field.value.trim();
        nextQuestion();
      } else {
        alert('Por favor, informe seu primeiro nome para continuarmos.');
      }
    }

    function prevQuestion() {
      if (state.currentQuestionIndex > 0) {
        state.currentQuestionIndex--;
        render();
      }
    }

    function nextQuestion() {
      if (state.currentQuestionIndex < questions.length - 1) {
        state.currentQuestionIndex++;
        render();
      } else {
        state.step = 'analyzing';
        render();
      }
    }

    let isAudioPlaying = false;
    function toggleAudioDemo() {
      isAudioPlaying = !isAudioPlaying;
      const btn = document.getElementById('play-btn');
      if (btn) btn.innerText = isAudioPlaying ? '❚❚' : '▶';
    }

    /* 4. ANALYZING SCREEN */
    function renderAnalyzing() {
      container.innerHTML = `
        <div class="fade-in text-center" style="padding: 1.5rem 0;">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem; animation: pulse 1s infinite;">⚙️</div>
          <h2>Processando suas respostas...</h2>
          <p style="margin-top: 0.5rem;">Cruzando seus hábitos digestivos com a base clínica de @zuy_silva emagrecer.</p>
          <div style="width: 100%; height: 0.6rem; background: #E5E7EB; border-radius: 9999px; overflow: hidden; margin: 1.5rem 0;">
            <div id="analyze-bar" style="height: 100%; width: 10%; background: var(--color-emerald-deep); transition: width 0.1s linear;"></div>
          </div>
          <div id="analyze-status" style="font-size: 0.85rem; font-weight: 700; color: var(--color-emerald-deep);">
            Mapeando velocidade intestinal...
          </div>
        </div>
      `;

      let progress = 10;
      const bar = document.getElementById('analyze-bar');
      const status = document.getElementById('analyze-status');
      const timer = setInterval(() => {
        progress += 5;
        if (bar) bar.style.width = progress + '%';
        if (progress === 40 && status) status.innerText = 'Identificando alimentos que geram fermentação...';
        if (progress === 75 && status) status.innerText = 'Estruturando cronograma prático de 7 dias...';
        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            state.step = 'bmi_alert';
            render();
          }, 400);
        }
      }, 70);
    }

    /* 5. BMI ALERT SCREEN */
    function renderBmiAlert() {
      const heightM = state.height / 100;
      const imc = (state.weight / (heightM * heightM)).toFixed(1).replace('.', ',');

      container.innerHTML = `
        <div class="fade-in text-center">
          <span style="background: #FEF3C7; color: #92400E; padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
            ⚠️ Diagnóstico Preliminar
          </span>
          <h2 style="color: #DC2626; margin: 0.75rem 0 0.5rem;">
            Atenção${state.leadName ? `, ${state.leadName}` : ''}! Seu corpo está em estado de RETENÇÃO E FERMENTAÇÃO
          </h2>
          <p>Seu Índice de Massa Corporal aponta <strong>${imc} kg/m²</strong>.</p>
          <div style="background: #FEF2F2; border: 1.5px solid #FCA5A5; border-radius: var(--radius-lg); padding: 1.25rem; margin: 1.25rem 0; text-align: left; font-size: 0.875rem; line-height: 1.6;">
            <strong>Por que você não consegue desinchar apenas com dieta?</strong><br>
            Quando o intestino retém gases por fermentação de alimentos específicos e digestão lenta, a parede abdominal expande mecanicamente. O seu protocolo age diretamente nessa distensão antes da perda de gordura.
          </div>
          <button class="btn-cta" onclick="state.step = 'wheel'; render();">
            GIRAR ROLETA DE BÔNUS →
          </button>
        </div>
      `;
    }

    /* 6. BONUS WHEEL SCREEN */
    function renderWheel() {
      container.innerHTML = `
        <div class="fade-in text-center">
          <span style="background: var(--color-emerald-light); color: var(--color-emerald-deep); padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
            🎁 Presente Exclusivo
          </span>
          <h2 style="margin: 0.75rem 0 0.35rem;">Gire a Roleta e Ganhe um Bônus</h2>
          <p>Libere um presente complementar para acelerar seu desinchaço:</p>

          <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div class="wheel-canvas" id="wheel-disc" style="background: conic-gradient(#b8532c 0 60deg, #d32f2f 60deg 120deg, #2e7d32 120deg 180deg, #b78103 180deg 240deg, #1f4a32 240deg 300deg, #e65100 300deg 360deg);"></div>
          </div>

          <button class="btn-cta" id="spin-btn" onclick="spinWheelAction()">
            GIRAR ROLETA AGORA 🎯
          </button>
        </div>
      `;
    }

    function spinWheelAction() {
      const disc = document.getElementById('wheel-disc');
      const btn = document.getElementById('spin-btn');
      if (btn) btn.disabled = true;

      const randomDegree = 1800 + Math.floor(Math.random() * 360);
      if (disc) disc.style.transform = `rotate(${randomDegree}deg)`;

      setTimeout(() => {
        state.step = 'lead_form';
        render();
      }, 3600);
    }

    /* 7. LEAD FORM SCREEN */
    function renderLeadForm() {
      container.innerHTML = `
        <div class="fade-in">
          <span style="background: var(--color-emerald-light); color: var(--color-emerald-deep); padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
            ✅ Diagnóstico Concluído
          </span>
          <h2 style="margin: 0.75rem 0 0.5rem;">
            ${state.leadName || 'Parabéns'}, seu protocolo de 7 dias está pronto!
          </h2>
          <p style="margin-bottom: 1.25rem;">
            Informe seu e-mail e WhatsApp para desbloquear seu resultado completo e receber a confirmação de acesso:
          </p>

          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
            <div>
              <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 0.25rem;">Seu E-mail Principal:</label>
              <input type="email" id="lead-email" placeholder="seuemail@exemplo.com" style="width: 100%; min-height: 3rem; padding: 0.75rem; border: 1.5px solid var(--color-border); border-radius: var(--radius-md); font-size: 1rem;" />
            </div>
            <div>
              <label style="font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 0.25rem;">WhatsApp / Telemóvel (com DDD):</label>
              <input type="tel" id="lead-phone" placeholder="(XX) 99999-9999" style="width: 100%; min-height: 3rem; padding: 0.75rem; border: 1.5px solid var(--color-border); border-radius: var(--radius-md); font-size: 1rem;" />
            </div>
          </div>

          <button class="btn-cta" onclick="submitLeadAndGoResult()">
            ACESSAR MEU PROTOCOLO COMPLETO →
          </button>
        </div>
      `;
    }

    function submitLeadAndGoResult() {
      const email = document.getElementById('lead-email')?.value.trim();
      if (!email || !email.includes('@')) {
        alert('Por favor, informe um e-mail válido para liberar seu acesso.');
        return;
      }
      state.step = 'result';
      render();
    }

    /* 8. RESULT & CONVERSION SCREEN */
    function renderResult() {
      container.innerHTML = `
        <div class="fade-in">
          <!-- Urgency Countdown -->
          <div class="timer-alert">
            <span>⚡ Sua vaga e bônus expiram em:</span>
            <span class="timer-clock" id="timer-display">14:45</span>
          </div>

          <span style="background: var(--color-emerald-light); color: var(--color-emerald-deep); padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
            Plano Personalizado @zuy_silva emagrecer
          </span>

          <h1 style="margin: 0.75rem 0 0.5rem;">
            Protocolo Desinchar em 7 Dias: Elimine a Fermentação Abdominal
          </h1>

          <p style="margin-bottom: 1.25rem;">
            ${state.leadName ? `<strong>${state.leadName}</strong>, mapeamos` : 'Mapeamos'} que sua barriga estufa principalmente por acúmulo de gases fermentativos. Com ajustes estratégicos de hidratação e substituição de 3 gatilhos, o alívio na calça ocorre nas primeiras 48h a 72h.
          </p>

          <!-- What's included box -->
          <div style="background: #F0FDF4; border: 1.5px solid #86EFAC; border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem;">
            <h3 style="color: var(--color-emerald-deep); margin-bottom: 0.5rem;">O Que Você Recebe Imediatamente:</h3>
            <ul style="list-style: none; font-size: 0.9rem; line-height: 1.7; color: #166534;">
              <li>✔️ <strong>Cronograma Diário de 7 Dias:</strong> Bebidas e refeições anti-inchaço.</li>
              <li>✔️ <strong>Guia de Trocas Inteligentes:</strong> Substitua sem passar fome.</li>
              <li>✔️ <strong>Bônus da Roleta:</strong> ${state.wonBonus} (R$ 0,00).</li>
              <li>✔️ <strong>Garantia Blindada de 30 Dias:</strong> Risco zero.</li>
            </ul>
          </div>

          <!-- Checkout CTA Button -->
          <a href="${HOTMART_CHECKOUT_URL}" target="_blank" rel="noopener noreferrer" class="btn-cta" style="margin-bottom: 1rem;">
            QUERO DESINCHAR MINHA BARRIGA AGORA →
          </a>

          <div style="text-align: center; font-size: 0.75rem; color: var(--color-text-muted); margin-bottom: 1.5rem;">
            🔒 Pagamento 100% Seguro pela Hotmart · Acesso Imediato
          </div>

          <!-- Testimonials Section -->
          <h3 style="margin-top: 1.5rem; margin-bottom: 0.75rem;">Depoimentos Reais de Quem Já Fez:</h3>
          <div class="testimonial-card">
            <div style="color: #EAB308; font-size: 1rem;">⭐⭐⭐⭐⭐</div>
            <p style="font-style: italic; color: var(--color-text-main); font-size: 0.9rem;">
              "Respondi ao teste e comecei o cronograma no mesmo dia. Em 4 dias minhas calças jeans voltaram a fechar sem apertar a cintura. Nunca imaginei que o segredo era a fermentação!"
            </p>
            <div style="font-weight: 700; font-size: 0.8rem; color: var(--color-emerald-deep);">
              — Mariana F. (38 anos) · Perdeu 3,2 kg de inchaço
            </div>
          </div>

          <!-- FAQ Accordion -->
          <h3 style="margin-top: 1.5rem; margin-bottom: 0.75rem;">Perguntas Frequentes:</h3>
          <div class="faq-item" onclick="this.classList.toggle('open')">
            <button class="faq-question">
              <span>Funciona para qualquer idade?</span>
              <span>+</span>
            </button>
            <div class="faq-answer">
              Sim! O protocolo foi desenvolvido especialmente para mulheres a partir dos 35 anos, quando alterações hormonais desaceleram a digestão. Funciona com segurança e eficácia comprovada.
            </div>
          </div>
          <div class="faq-item" onclick="this.classList.toggle('open')">
            <button class="faq-question">
              <span>Por quanto tempo tenho acesso?</span>
              <span>+</span>
            </button>
            <div class="faq-answer">
              Você tem acesso vitalício a todo o material, podendo consultar e repetir o cronograma sempre que desejar.
            </div>
          </div>
          <div class="faq-item" onclick="this.classList.toggle('open')">
            <button class="faq-question">
              <span>E se eu não gostar ou não funcionar?</span>
              <span>+</span>
            </button>
            <div class="faq-answer">
              Você possui 30 dias de garantia blindada. Se não sentir seu abdômen desinchar, basta um clique e 100% do seu dinheiro é devolvido. Sem perguntas.
            </div>
          </div>

          <!-- Bottom Restart Action -->
          <div style="margin-top: 2rem; text-align: center;">
            <button class="btn-secondary" onclick="location.reload()">
              🔄 Refazer a Avaliação
            </button>
          </div>
        </div>
      `;

      startCountdown(14 * 60 + 45);
    }

    function startCountdown(duration) {
      let timer = duration;
      const interval = setInterval(() => {
        const minutes = parseInt(timer / 60, 10);
        const seconds = parseInt(timer % 60, 10);
        const display = document.getElementById('timer-display');
        if (display) {
          display.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
        if (--timer < 0) {
          clearInterval(interval);
        }
      }, 1000);
    }

    // Inicialização da aplicação
    render();
  </script>
</body>
</html>
